[project]
name = "mcp-sandbox-pyrepl"
version = "0.7.1"
description = "MCP server providing a sandboxed, stateful Python REPL via Docker"
requires-python = ">=3.10"
dependencies = [
    "docker>=7.0.0",
    "fastmcp>=3.4.2",
    "pyyaml>=6.0",
]

[project.scripts]
mcp-sandbox-pyrepl = "src.main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
exclude-newer = "30 days"

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
addopts = "-v --tb=short --cov=src"
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.src]
include = ["src"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-xdist>=3",
    "ruff>=0.5",
    "testcontainers>=4.14.2",
    "ty>=0.0.18",
]
