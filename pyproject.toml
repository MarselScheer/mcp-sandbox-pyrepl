[project]
name = "mcp-sandbox-pyrepl"
version = "0.1.0"
description = "MCP server providing a sandboxed, stateful Python REPL via Docker"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "docker>=7.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
mcp-sandbox-pyrepl = "src.main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy._Backend"

[tool.uv]
exclude-newer = "30 days"